name: Modelli free — audit settimanale

# Verifica ogni lunedì che i modelli free configurati rispondano davvero e, se un
# provider li ha ritirati (404/410), sceglie un sostituto verificato con una
# generazione reale, aggiorna lib/ai-models.mjs, esegue il build e committa.
#
# Richiede i repository secrets: GEMINI_API_KEY, GROQ_API_KEY, NVIDIA_API_KEY,
# OPENROUTER_API_KEY (opzionali per le notifiche: WATCHDOG_WEBHOOK_URL,
# WATCHDOG_TELEGRAM_TOKEN, WATCHDOG_TELEGRAM_CHAT_ID).

on:
  schedule:
    # GitHub Actions accetta solo UTC. Si schedulano entrambe le ore possibili
    # (ora legale/solare): la consegna dei cron può però slittare di molte ore,
    # quindi non si pretende una fascia oraria precisa e la deduplicazione nel
    # job garantisce un solo audit per settimana.
    - cron: '0 7 * * 1' # lunedì 07:00 UTC = 09:00 CEST (ora legale)
    - cron: '0 8 * * 1' # lunedì 08:00 UTC = 09:00 CET (ora solare)
  workflow_dispatch:
    inputs:
      apply:
        description: 'Applica e committa le sostituzioni (deseleziona per solo audit)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read # serve al passo di dedup per leggere le esecuzioni precedenti

concurrency:
  group: models-autoupdate
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # I due cron (ora legale/solare) fanno partire il workflow due volte ogni
      # lunedì, ma GitHub Actions può consegnarli con molte ore di ritardo (qui
      # anche 9-10 ore): un guard che pretende le 09:00 in punto scarta tutte le
      # esecuzioni e l'audit non parte più.
      # Regola attuale: l'audit gira una sola volta a settimana, all'ora in cui
      # GitHub lo consegna, e i run successivi si fermano se un altro run della
      # stessa settimana ha già eseguito il passo "Audit modelli free".
      # Le esecuzioni manuali (workflow_dispatch) non vengono mai saltate.
      - name: Guardia settimanale (dedup esecuzioni)
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Ora locale Europe/Rome: $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M %Z')"
          # Inizio della settimana corrente (lunedì 00:00 Europe/Rome), così il
          # dedup vale per la settimana e non per una finestra mobile di giorni.
          dow=$(TZ=Europe/Rome date +%u)
          inizio=$(TZ=Europe/Rome date -d "-$((dow - 1)) days 00:00" +%s)
          altri=$(gh api "repos/$REPO/actions/workflows/weekly-models.yml/runs?per_page=20" \
            --jq ".workflow_runs[] | select(.id != ${RUN_ID}) | select((.created_at | fromdateiso8601) >= ${inizio}) | .id")
          for id in $altri; do
            stato=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
              --jq '[.jobs[].steps[] | select(.name == "Audit modelli free") | .conclusion] | first // "assente"')
            if [ "$stato" = "success" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Esecuzione ignorata: l'audit è già stato eseguito dal run $id."
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Prima esecuzione utile della settimana: procedo con l'audit."

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Audit modelli free
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WATCHDOG_WEBHOOK_URL: ${{ secrets.WATCHDOG_WEBHOOK_URL }}
          WATCHDOG_TELEGRAM_TOKEN: ${{ secrets.WATCHDOG_TELEGRAM_TOKEN }}
          WATCHDOG_TELEGRAM_CHAT_ID: ${{ secrets.WATCHDOG_TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" != "true" ]; then
            node scripts/auto-update-models.mjs
          else
            node scripts/auto-update-models.mjs --apply --commit
          fi
